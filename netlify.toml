[build]
  publish = "."

# frame-ancestors is intentionally open for stakeholder review.
# Before production, restrict it to the confirmed Instapage and
# Best Lawyers parent domains, for example:
#   frame-ancestors https://*.instapage.com https://www.bestlawyers.com
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
